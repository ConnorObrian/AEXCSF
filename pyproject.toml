[project]
name = "AEXCSF"
version="1.1"
description = "(V)AE and XCSF Hybrid System intended for multi-step RL experiments"
authors = [
    {name = "Armin Mackensen"},
    {name = "Connor Schönberner", email = "cos@informatik.uni-kiel.de"}
]
readme = "README.md"
requires-python = "==3.13.*"

dependencies = [
    "numpy==2.4.4",
    "torch==2.9",
    "torchvision",
    "scipy",
    "torchinfo",
    "torchshape",
    "torch-geometric",
    "vector-quantize-pytorch==1.28.1",
    "gymnasium[atari, accept-rom-license, other]==1.2.3",
    "xcsf==1.4.10",
    "tensorboard",
    "tqdm",
    "tyro",
    "minigrid==3.0.0",
    "vizdoom==1.3.0",
    "colorcet>=3.1.0",
    "dill",
    "matplotlib",
    "seaborn",
    "transformers==5.5.0",
    "timm==1.0.26",
    "torchmetrics==1.9.0",
    "pandas",
    "stable_baselines3==2.8.0",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.uv]
package = true

[tool.setuptools]
packages = ["Autoencoder", "AXNex", "DatasetMaker", "env_wrapper"]
